name: Publish Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 5.2.5)'
        required: false
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-15
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go/go.sum

      - name: Build binary
        run: |
          cd go
          mkdir -p ../bin
          BINARY_NAME=${{ matrix.os == 'windows' && 'rlm-go.exe' || 'rlm-go' }}
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o "../bin/${BINARY_NAME}" ./cmd/rlm
          ls -lh ../bin/
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/
          retention-days: 1

  # Publish each platform package as a separate job so each gets its own
  # OIDC provenance token (npm trusted publishing requires 1 package per job)
  publish-darwin-arm64:
    name: Publish @recursive-llm/darwin-arm64
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-arm64
          path: bin
      - name: Build and publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ github.event.inputs.version || '' }}
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          node scripts/publish-platform-package.js darwin arm64 "$VERSION" bin/rlm-go

  publish-darwin-x64:
    name: Publish @recursive-llm/darwin-x64
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-amd64
          path: bin
      - name: Build and publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ github.event.inputs.version || '' }}
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          node scripts/publish-platform-package.js darwin x64 "$VERSION" bin/rlm-go

  publish-linux-x64:
    name: Publish @recursive-llm/linux-x64
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: bin
      - name: Build and publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ github.event.inputs.version || '' }}
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          node scripts/publish-platform-package.js linux x64 "$VERSION" bin/rlm-go

  publish-linux-arm64:
    name: Publish @recursive-llm/linux-arm64
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-arm64
          path: bin
      - name: Build and publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ github.event.inputs.version || '' }}
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          node scripts/publish-platform-package.js linux arm64 "$VERSION" bin/rlm-go

  publish-win32-x64:
    name: Publish @recursive-llm/win32-x64
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: binary-windows-amd64
          path: bin
      - name: Build and publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=${{ github.event.inputs.version || '' }}
          [ -z "$VERSION" ] && VERSION=$(node -p "require('./package.json').version")
          node scripts/publish-platform-package.js win32 x64 "$VERSION" bin/rlm-go.exe
