name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  go-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.27.x']
        include:
          # go.mod declares go 1.25.0 as the minimum; keep it building there.
          - os: ubuntu-latest
            go-version: '1.25.x'

    env:
      # Use the selected Go version rather than auto-switching to go.mod's toolchain line.
      GOTOOLCHAIN: local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Run Go tests
        working-directory: go
        run: go test ./rlm/... -v

      - name: Run Go linting
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: go
          install-mode: goinstall
          version: v2.14.0

  build-and-test:
    runs-on: ${{ matrix.os }}
    needs: go-test

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # vitest 4 / vite 7 require Node >= 20.19 (Node 18 is EOL)
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check package
        run: npm pack --dry-run
